<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Mask for transparency -->
    <mask id="tail-mask">
      <!-- Everything white stays -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Black cuts out -->
      <!-- Swooping line from bottom-right up to airplane tail -->
      <path d="M 92,85 C 80,85 71,83 67,73 C 63,65 63,59 63,57 C 65,57 66,58 68,60 C 71,64 77,73 92,75 Z" fill="#000000" />
      
      <!-- Airplane cutout -->
      <g transform="translate(76, 46) rotate(45)">
        <path d="M 0,-18 C 1.5,-18 3,-16 3,-12 L 3,12 C 3,15 0,18 0,18 C 0,18 -3,15 -3,12 L -3,-12 C -3,-16 -1.5,-18 0,-18 Z" fill="#000000" />
        <path d="M 0,-4 L 18,10 C 18,10 16,11 15,11 L 3,4 L 3,12 L 8,15 L 8,17 L 0,15 L -8,17 L -8,15 L -3,12 L -3,4 L -15,11 C -16,11 -18,10 -18,10 Z" fill="#000000" />
      </g>
    </mask>
  </defs>

  <!-- Red wing tail fin -->
  <path d="M 15,80 C 35,65 55,42 75,20 L 95,20 C 98,20 98,22 98,25 L 98,80 C 98,83 95,85 92,85 L 15,85 Z" fill="#EA1C24" mask="url(#tail-mask)" />
</svg>
