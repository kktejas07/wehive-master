# WeHive Maestro E2E Flows

Six flows covering auth, visa, flights, hotels, and destination discovery.
Drop the `.maestro/` folder into the WeHive mobile repo root.

## Before first run

1. **App ID** — replace `com.axiss.wehive` in every file with the real value
   from `app.json` (`android.package` / `ios.bundleIdentifier`).
2. **Build** — Maestro needs a real build installed on the emulator/simulator.
   Use an Expo dev client or EAS build (`eas build --profile development`),
   not Expo Go, so the app ID matches.
3. **Firebase test phone number** — Console → Authentication → Sign-in method →
   Phone → add a test number with a fixed OTP. Update `02-login-phone-otp.yaml`.
4. **Test account** — create a dedicated email/password user for
   `01-login-email.yaml`.
5. **Sandbox APIs** — point the E2E build at Duffel test mode and Hotelbeds
   sandbox so searches don't hit production quotas.
6. **testIDs** — the flows reference ids like `flight-search-button`. Add
   `testID="..."` props to those elements, or open `maestro studio` against
   the running app and swap in whatever selectors it shows you. Text-based
   `tapOn: "..."` works too but breaks when copy changes.

## Running

```bash
# one flow
maestro test .maestro/01-login-email.yaml

# everything
maestro test .maestro/
```

## Composing flows

Flows 03–06 assume a logged-in state. Either rely on session persistence
(run login first, don't clear state), or make each flow self-contained:

```yaml
- runFlow: 01-login-email.yaml
```

## CI

Screenshots land in `~/.maestro/tests/`. In GitHub Actions, run on an
Android emulator (e.g. reactivecircus/android-emulator-runner) and upload
that folder as an artifact on failure.
